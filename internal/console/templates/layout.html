<!doctype html>
<html lang="en" data-root="{{.Root}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{block "title" .}}Console{{end}} · CairnPost</title>
<link rel="stylesheet" href="{{.Root}}/assets/console.css?v={{.Assets}}">
<link rel="stylesheet" href="{{.Root}}/assets/board.css?v={{.Assets}}">
<link rel="icon" type="image/svg+xml" href="{{.Root}}/assets/favicon.svg?v={{.Assets}}">
<script src="{{.Root}}/assets/console.js?v={{.Assets}}" defer></script>
</head>
<body>
{{if .Who}}
<header class="band">
  <a class="mark" href="{{.Root}}/">{{template "cairn"}}<span class="word">Cairn<b>Post</b></span></a>
  <p class="pulse{{if .Pulse.Failing}} pulse-failing{{end}}">{{if .Pulse.Failing}}{{template "ico" "failing"}}{{else}}{{template "ico" "ok"}}{{end}}<a href="{{.Root}}/#server">{{.Pulse.Says}}</a></p>
  <form class="who" method="post" action="{{.Root}}/signout">
    <span class="who-name" title="The key you are signed in with">{{.Who.Name}}</span>
    <button class="quiet" type="submit">Sign out</button>
  </form>
</header>
<nav class="tabs" aria-label="Console">
  <a href="{{.Root}}/" {{if eq .Page "overview"}}aria-current="page"{{end}}>Overview</a>
  <a href="{{.Root}}/emails" {{if or (eq .Page "emails") (eq .Page "email") (eq .Page "cancel")}}aria-current="page"{{end}}>Emails</a>
  <a href="{{.Root}}/suppressions" {{if or (eq .Page "suppressions") (eq .Page "lift")}}aria-current="page"{{end}}>Suppressions</a>
  <a href="{{.Root}}/webhooks" {{if or (eq .Page "webhooks") (eq .Page "endpoint") (eq .Page "remove") (eq .Page "secret")}}aria-current="page"{{end}}>Webhooks</a>
  <a href="{{.Root}}/domains" {{if or (eq .Page "domains") (eq .Page "domain")}}aria-current="page"{{end}}>Domains</a>
  <a href="{{.Root}}/keys" {{if or (eq .Page "keys") (eq .Page "revoke")}}aria-current="page"{{end}}>API keys</a>
</nav>
{{end}}
<main{{if not .Who}} class="alone"{{end}}>
{{if .Notice}}<p class="notice" role="status">{{.Notice}}</p>{{end}}
{{block "main" .}}{{end}}
</main>
</body>
</html>
