name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: build / vet / unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l .)" || (echo "gofmt needed:"; gofmt -l .; exit 1)
      - run: go vet ./...
      - run: go vet -tags=integration ./...
      - run: go build ./...
      - run: go test ./...

  integration:
    name: integration (postgres)
    runs-on: ubuntu-latest
    env:
      CAIRNPOST_TEST_DSN: postgres://cairnpost:cairnpost@localhost:5425/cairnpost?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The database comes from the project's own Compose file: the tests
      # run against exactly what a self-hoster runs.
      - run: docker compose up -d --wait postgres
      - run: go test -tags=integration -count=1 -p 1 ./...

  image:
    name: image builds and answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait postgres cairnpost
      - run: |
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8025/health && exit 0
            sleep 1
          done
          docker compose logs cairnpost
          exit 1
